<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>災害VC運営シミュレーター</title>
<style>
:root{
  --bg:#eef1f2;
  --panel:#ffffff;
  --line:#dfe4e6;
  --line2:#eceff0;
  --text:#333333;
  --sub:#7b8a8f;
  --blue:#3498db;
  --blue-d:#2980b9;
  --orange:#f0a13c;
  --orange-d:#dd8a20;
  --red:#e74c3c;
  --green:#27ae60;
  --navy:#41545c;
  /* 媒体の3色。色相を大きく離して、ひと目で見分けられるようにしています */
  --kin:#1565c0;      --kin-bg:#e7f0fb;    /* 💻 kintone ＝ 青   */
  --paper:#a8670e;    --paper-bg:#fdf6e6;  /* 📄 紙       ＝ 琥珀 */
  --talk:#5b2d86;     --talk-bg:#f2ebfa;   /* 🗣 口頭     ＝ 紫   */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.7;
  padding-bottom:80px;
}
#app{max-width:820px;margin:0 auto;padding:0 12px;}

/* ===== 上部バー ===== */
#topbar{
  position:sticky;top:0;z-index:50;
  background:var(--navy);color:#fff;
  margin:0 0 12px;padding:8px 14px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
#topbar,#progress{max-width:none;}
#topbar .clock{font-size:20px;font-weight:bold;letter-spacing:1px;font-variant-numeric:tabular-nums;}
#topbar .phase{font-size:13px;opacity:.9;}
#topbar .team{
  margin-left:auto;background:var(--orange);color:#fff;
  padding:3px 12px;border-radius:20px;font-size:12px;font-weight:bold;
}
#progress{height:4px;background:#d7dcde;margin:0;}

/* いま1日のどこにいるかを、つねに出しておきます */
#flowstrip{
  display:none;gap:4px;flex-wrap:wrap;align-items:center;
  background:#fff;border-bottom:1px solid var(--line);padding:7px 10px;margin:0 0 12px;
}
#flowstrip.on{display:flex;}
#flowstrip span{
  padding:3px 9px;border-radius:12px;background:#eef1f2;color:#93a0a4;
  white-space:nowrap;font-size:.76rem;
}
#flowstrip span.done{background:#e4efe8;color:#5c8a6d;}
#flowstrip span.now{background:var(--orange);color:#fff;font-weight:bold;}
#backbtn,#sizebtn{
  background:rgba(255,255,255,.14);color:#fff;
  border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:5px 13px;
}
#backbtn:not(:disabled):hover,#sizebtn:hover{background:rgba(255,255,255,.28);}
#backbtn:disabled{opacity:.25;}
#progress > div{height:100%;background:var(--orange);width:0;transition:width .4s;}

/* ===== タイトル ===== */
.titlecard{
  background:var(--navy);
  background-image:radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);
  background-size:6px 6px;
  color:#fff;border-radius:10px;text-align:center;
  padding:40px 20px 32px;margin-bottom:14px;
}
.titlecard .pixtitle{
  display:block;width:min(100%,300px);height:auto;margin:0 auto 20px;
  fill:var(--orange);
}
.titlecard .tmain{
  font-size:clamp(19px,5.2vw,27px);font-weight:bold;
  letter-spacing:.12em;margin:0 0 8px;
  text-shadow:3px 3px 0 rgba(0,0,0,.32);
}
.titlecard .tsub{font-size:12.5px;opacity:.7;margin:0;letter-spacing:.06em;}

/* ===== シルエット ===== */
.sil{display:block;width:100%;height:100%;fill:currentColor;}
.silrow{
  display:flex;justify-content:center;align-items:flex-end;gap:4px;
  color:var(--navy);opacity:.42;height:52px;
}
.silrow .sil{width:40px;height:46px;}
.silrow .sil:nth-child(even){height:52px;}

/* ===== ナビ（先輩職員） ===== */
.navi{
  display:flex;gap:10px;align-items:flex-start;
  background:#fffaf0;border:1px solid #f3ddb5;border-radius:10px;
  padding:12px 14px;margin-bottom:14px;
}
.navi .face{
  flex:0 0 40px;height:40px;border-radius:50%;
  background:var(--orange);color:#fff;overflow:hidden;
  display:flex;align-items:flex-end;justify-content:center;
}
.navi .face .sil{width:36px;height:36px;margin-bottom:-3px;}
.navi .say{flex:1;font-size:14px;}
.navi .say b{color:var(--orange-d);}

/* ===== 汎用パネル ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px;}
.panel h2{margin:0 0 10px;font-size:17px;}
.panel p{margin:0 0 10px;}
.muted{color:var(--sub);font-size:13px;}
.center{text-align:center;}

/* ===== ボタン ===== */
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;border-radius:6px;padding:11px 20px;transition:.15s;}
button:disabled{opacity:.4;cursor:not-allowed;}
.btn{background:var(--blue);color:#fff;}
.btn:not(:disabled):hover{background:var(--blue-d);}
.btn-lg{display:block;width:100%;padding:15px;font-size:17px;font-weight:bold;}
.btn-gray{background:#fff;color:var(--text);border:1px solid #c9d1d4;}
.btn-gray:not(:disabled):hover{background:#f4f6f7;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-orange:not(:disabled):hover{background:var(--orange-d);}
.btn-sm{padding:6px 13px;font-size:13px;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.btnrow.end{justify-content:flex-end;}

/* ============================================================
   媒体の見分け
   ------------------------------------------------------------
   初めての人が「これは紙？パソコンの画面？口で言うだけ？」で
   迷わないよう、3つを色と見出しではっきり分けています。
     青い枠  … kintoneアプリ（記録が残る）
     橙色の枠… 紙の書類（手書き・印刷して渡す）
     紫色の枠… 口頭でのやりとり（記録は残らない）
   ============================================================ */
.kin::before{
  content:"💻 kintone アプリ　―　入力すると記録が残ります";
  display:block;background:var(--kin);color:#fff;
  font-size:.8rem;font-weight:bold;padding:5px 12px;letter-spacing:.03em;
}
.sheet::before{
  content:"📄 紙の書類　―　手書きで記入します";
  display:block;background:var(--paper);color:#fff;
  font-size:.8rem;font-weight:bold;padding:5px 10px;letter-spacing:.03em;
  margin:-14px -14px 12px;
}
.doc::before{
  content:"📄 紙の書類　―　印刷して手渡します";
  display:block;background:var(--paper);color:#fff;
  font-size:.8rem;font-weight:bold;padding:5px 10px;letter-spacing:.03em;
  margin:-18px -18px 14px;
}
.phone::before{
  content:"🗣 口頭でのやりとり　―　このままでは記録に残りません";
  display:block;font-size:.8rem;opacity:.75;margin-bottom:9px;letter-spacing:.03em;
  position:relative;
}
.sheetov-body .sheet::before{margin:-12px -12px 12px;}

/* ===== kintone風 ===== */
.kin{background:var(--kin-bg);border:3px solid var(--kin);border-radius:8px;overflow:hidden;margin-bottom:14px;}
.kin-head{
  background:#f4f6f7;border-bottom:1px solid var(--line);
  padding:9px 14px;display:flex;align-items:center;gap:10px;
}
.kin-head .ic{
  width:26px;height:26px;border-radius:5px;background:var(--orange);
  color:#fff;font-size:8px;line-height:1.1;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;
}
.kin-head .nm{font-weight:bold;font-size:14px;}
.kin-head .plus{
  margin-left:auto;width:30px;height:30px;border-radius:50%;
  background:var(--blue);color:#fff;font-size:19px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.kin-body{padding:16px 14px;background:#fff;}
.kin-foot{border-top:1px solid var(--line2);background:#fafbfb;padding:12px 14px;display:flex;gap:10px;justify-content:center;}

/* フィールド */
.fld{margin-bottom:15px;}
.fld > label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
.fld > label .req{color:var(--red);margin-left:4px;font-size:11px;}
.fld input[type=text],.fld input[type=number],.fld textarea,.fld select{
  width:100%;padding:8px 10px;border:1px solid #c9d1d4;border-radius:4px;
  font-family:inherit;font-size:15px;background:#fff;color:var(--text);
}
.fld textarea{min-height:78px;resize:vertical;line-height:1.6;overflow:hidden;}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue);}
.fld.err input,.fld.err textarea,.fld.err .opts{border-color:var(--red);background:#fff6f5;}
.fld .errmsg{color:var(--red);font-size:12px;margin-top:4px;display:none;}
.fld.err .errmsg{display:block;}
.fld .hint{font-size:12px;color:var(--sub);margin-top:4px;}
.lookup{display:flex;gap:6px;}
.lookup input{flex:1;}
.readonly{background:#f4f6f7 !important;color:#5b6b70;}

/* 選択肢 */
.opts{display:flex;flex-wrap:wrap;gap:7px;padding:2px;border:1px solid transparent;border-radius:4px;}
.opt{
  border:1px solid #c9d1d4;background:#fff;border-radius:5px;
  padding:7px 14px;font-size:14px;cursor:pointer;user-select:none;
}
.opt:hover{background:#f4f6f7;}
.opt.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.opt.on.warn{background:var(--red);border-color:var(--red);}

/* グループ見出し */
.grp{border:1px solid var(--line);border-radius:6px;margin-bottom:15px;}
.grp > .gh{background:#f4f6f7;padding:7px 12px;font-size:13px;font-weight:bold;border-bottom:1px solid var(--line);}
.grp > .gb{padding:14px 12px 1px;}

/* アクションボタン（橙） */
.actbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#fff8ee;border-bottom:1px solid var(--line2);}
.actbtn{background:var(--orange);color:#fff;border-radius:5px;padding:7px 15px;font-size:13px;}

/* 一覧テーブル */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{background:#f4f6f7;color:var(--sub);font-weight:normal;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top;}
.tbl tr.new td{animation:flash 1.2s;}
@keyframes flash{from{background:#fff2d6;}to{background:transparent;}}
.tblwrap{overflow-x:auto;}

/* バッジ */
.badge{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:bold;white-space:nowrap;}
.b-blue{background:#e3f1fb;color:var(--blue-d);}
.b-orange{background:#fdefdc;color:var(--orange-d);}
.b-red{background:#fdeceb;color:var(--red);}
.b-green{background:#e6f5ed;color:var(--green);}
.b-gray{background:#eef1f2;color:var(--sub);}

/* ポータル（6アプリを説明つきで並べる） */
.applist{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 0;border-bottom:1px solid var(--line2);
}
.applist:last-of-type{border-bottom:none;}
.applist .ic{
  flex:0 0 46px;height:46px;border-radius:8px;background:var(--orange);color:#fff;
  font-size:.6rem;line-height:1.15;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:3px;white-space:pre-line;
}
.applist .tx{flex:1;font-size:.95rem;}
.applist .ds{font-size:.88rem;color:#5a6a70;margin-top:3px;}

/* ポータル */
.portal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.pcard{
  display:flex;align-items:center;gap:11px;background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:11px;cursor:pointer;
}
.pcard:hover{border-color:var(--orange);}
.pcard.seen{background:#fbfdfb;border-color:#cfe6d8;}
.pcard .ic{
  flex:0 0 42px;height:42px;border-radius:7px;background:var(--orange);color:#fff;
  font-size:9px;line-height:1.15;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:3px;white-space:pre-line;
}
.pcard .tx{font-size:13.5px;font-weight:bold;}
.pcard .chk{margin-left:auto;color:var(--green);font-size:15px;}

/* 電話 */
.phone{
  background:var(--talk);color:#fff;border:3px solid #3f1e63;border-radius:10px;padding:16px 18px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.phone .psil{
  position:absolute;right:16px;bottom:0;width:62px;height:70px;
  color:#fff;opacity:.17;pointer-events:none;
}
.phone .ring,.phone .line,.phone .who{position:relative;}
.phone .ring{font-size:13px;opacity:.8;margin-bottom:8px;}
.phone .line{margin:0 0 9px;font-size:15px;line-height:1.8;}
.phone .who{font-size:12px;opacity:.75;}

/* マッチング */
.mrow{display:flex;gap:12px;flex-wrap:wrap;}
.mcol{flex:1 1 300px;min-width:270px;}
.ncard{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:9px;background:#fff;cursor:pointer;}
.ncard:hover{border-color:var(--blue);}
.ncard.sel{border-color:var(--blue);border-width:2px;background:#f5fbff;}
.ncard.done{opacity:.6;background:#f6f8f8;cursor:default;}
.ncard .t{font-weight:bold;font-size:14px;margin-bottom:3px;}
.ncard .m{font-size:12px;color:var(--sub);}
.vchip{
  display:flex;align-items:center;gap:8px;border:1px solid #c9d1d4;background:#fff;
  border-radius:6px;padding:8px 11px;margin-bottom:6px;cursor:pointer;font-size:13.5px;
}
.vchip:hover{background:#f4f6f7;}
.vchip.on{background:#e3f1fb;border-color:var(--blue);}
.vchip.used{opacity:.4;cursor:not-allowed;background:#f2f4f5;}
.vchip .tag{margin-left:auto;}

/* モーダル */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:10px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px;}
.modal h3{margin:0 0 12px;font-size:17px;}

/* 活動依頼書プレビュー */
.doc{border:3px solid var(--paper);padding:18px;font-size:12.5px;background:#fff;line-height:1.9;}
.doc h4{text-align:center;margin:0 0 14px;font-size:16px;letter-spacing:3px;}
.doc table{width:100%;border-collapse:collapse;}
.doc td{border:1px solid #aaa;padding:5px 8px;}
.doc td.h{background:#f2f2f2;width:32%;white-space:nowrap;}

/* ===== 受付シート（紙） ===== */
.split{display:flex;gap:14px;align-items:flex-start;}
.split .sheetcol{flex:0 0 320px;position:sticky;top:64px;}
.split .formcol{flex:1 1 340px;min-width:0;}
.sheet{
  background:#fffdf7;border:3px solid var(--paper);border-radius:4px;padding:14px;overflow:hidden;
  font-size:12.5px;line-height:1.75;
  box-shadow:2px 2px 0 rgba(0,0,0,.05);
}
.sheet .st{text-align:center;font-weight:bold;font-size:13.5px;letter-spacing:1px;
  margin-bottom:4px;padding-bottom:5px;border-bottom:2px solid #b3a888;}
.sheet .note{text-align:center;font-size:11px;color:#8a7f63;margin-bottom:10px;}
.sheet .sec{background:#efe9d8;font-weight:bold;padding:2px 7px;margin:11px 0 6px;font-size:12px;}
.sheet .row{display:flex;gap:7px;margin-bottom:3px;}
.sheet .row .k{flex:0 0 74px;color:#7a7059;}
.sheet .row .v{flex:1;border-bottom:1px solid #d8cfb6;min-height:20px;word-break:break-all;}
.sheet .v.blank{color:#c0b79e;}
.sheet .v.filled{color:#1a3f6b;font-weight:bold;animation:ink .5s;}
@keyframes ink{from{background:#fff2c9;}to{background:transparent;}}
.sheet .free{border:1px solid #d8cfb6;background:#fff;min-height:46px;padding:6px 8px;}
.sheet ul{margin:0;padding-left:17px;}
.sheet li{margin-bottom:2px;}
.sheet .chk{margin-right:11px;white-space:nowrap;}
.sheetcol details{border:none;}
.sheetcol summary{display:none;}

/* ===== 上映用スクリーン（動画のかわり） ===== */
.screen{
  background:#22292c;border-radius:8px;padding:22px 18px 16px;text-align:center;color:#fff;
  position:relative;overflow:hidden;
}
.screen.playing{background:#161b1d;}
.screen.done{background:#2c3a33;}
.screen .scr-title{font-size:14px;font-weight:bold;margin-bottom:3px;}
.screen .scr-len{font-size:12px;opacity:.6;margin-bottom:14px;}
.screen .scr-play{
  background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.6);
  border-radius:30px;padding:9px 26px;font-size:15px;min-width:150px;
}
.screen .scr-play:not(:disabled):hover{background:rgba(255,255,255,.3);}
.screen .scr-play:disabled{opacity:1;border-color:rgba(255,255,255,.3);}
.screen .scr-bar{height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin-top:14px;}
.screen .scr-bar > div{height:100%;width:0;background:var(--orange);border-radius:2px;transition:width .13s linear;}

/* ===== 鉛筆で書き取るアニメーション（受付シート） ===== */
.sheet .v.writing,.sheet .free.writing{position:relative;}
.sheet .writing .ink{
  display:inline-block;
  animation:inkin .75s steps(24) both;
}
@keyframes inkin{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}
.sheet .writing::after{
  content:"✏️";position:absolute;left:0;top:-2px;font-size:1rem;
  animation:pencil .75s ease-out forwards;
}
@keyframes pencil{
  0%{left:0;opacity:1;}
  85%{left:calc(100% - 18px);opacity:1;}
  100%{left:calc(100% - 18px);opacity:0;}
}

/* ===== 押すべきボタンを指し示す指 ===== */
.finger{
  position:absolute;z-index:95;pointer-events:none;
  font-size:1.7rem;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
  animation:fingertap 1.15s ease-in-out infinite;
}
@keyframes fingertap{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(-7px,-8px);}
}

/* 現地調査の注意点 */
.caution{border-left:4px solid var(--orange);padding:9px 0 9px 13px;margin-bottom:11px;}
.caution .ct{font-weight:bold;font-size:1rem;margin-bottom:3px;display:flex;align-items:center;gap:8px;}
.caution .cn{
  flex:0 0 22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;
  font-size:.8rem;display:flex;align-items:center;justify-content:center;
}
.caution .cd{font-size:.92rem;color:#4f5f66;}

/* 写真の欄（撮影前） */
.photobox{
  border:1px dashed #c9d1d4;border-radius:6px;background:#f6f8f8;
  padding:26px 12px;text-align:center;color:var(--sub);font-size:.92rem;
}

/* ===== 自動入力を「見せる」 ===== */
.af{background:var(--kin-bg);border:1px solid #a9c8e8;border-radius:8px;padding:11px 12px;margin-bottom:12px;}
.af-head{font-size:.85rem;font-weight:bold;color:var(--kin);margin-bottom:7px;}
.af-log{max-height:230px;overflow:auto;}
.af-line{
  background:#fff;border-left:4px solid var(--kin);border-radius:0 5px 5px 0;
  padding:7px 10px;margin-bottom:6px;font-size:.9rem;
}
.af-say{font-size:.86rem;color:#4a6675;margin-top:3px;}
.af-src{
  display:inline-block;font-size:.75rem;font-weight:bold;border-radius:9px;
  padding:1px 8px;margin-right:7px;vertical-align:1px;
}
.af-src.s-sheet{background:#f6e6c2;color:#7a4b06;}
.af-src.s-roster{background:#d7e6f8;color:#0f4c94;}
.af-src.s-field{background:#dcf0e2;color:#1f6b3a;}
.af-src.s-talk{background:#e8dcf6;color:#4a1f77;}
.af-src.s-auto{background:#eceff0;color:#7b8a8f;}
.fld.filling{
  background:#fff8e4;border-radius:6px;
  box-shadow:0 0 0 3px #f7d98a;transition:box-shadow .2s;
}
.af-done{
  background:#e6f5ed;border:1px solid #b6dcc6;color:#2c6b46;
  border-radius:6px;padding:9px 12px;margin-top:8px;font-size:.92rem;font-weight:bold;
}

/* 入力した欄のすぐ下に出る、理由の吹き出し */
.callout{
  position:relative;margin-top:9px;
  background:#fffaf0;border:2px solid var(--orange);border-radius:8px;
  padding:11px 13px;
}
.callout::before{
  content:"";position:absolute;top:-11px;left:24px;
  border-left:10px solid transparent;border-right:10px solid transparent;
  border-bottom:10px solid var(--orange);
}
.co-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.co-n{margin-left:auto;font-size:.8rem;color:var(--sub);white-space:nowrap;}
.co-say{font-size:.93rem;margin-bottom:10px;}
.co-next{padding:9px 24px;}

/* ===== 受付シートから書き写すボタン ===== */
.copybox{
  background:var(--paper-bg);border:1px dashed #d6c69b;border-radius:6px;
  padding:9px 11px;margin-bottom:8px;
}
.copybtn{
  background:#8a7442;color:#fff;border-radius:16px;
  padding:9px 16px;font-size:.95rem;font-weight:bold;
}
.copybtn:hover{background:#75612f;}
.copybtn.done{background:#cfc6ae;color:#fff;}
.copybox .ch{font-size:.8rem;color:#7d6a3c;margin-bottom:6px;font-weight:bold;}

/* 本番との違いをはっきり書いておく */
.simplenote{
  background:#eef4f8;border-left:4px solid #7fa8c4;
  padding:8px 11px;margin:0 0 12px;font-size:.85rem;color:#3f5e73;border-radius:0 5px 5px 0;
}

/* 文例ボタン（一から文章を打たなくても進めるように） */
.samples{
  background:#f4f8fa;border:1px solid #d5e3ea;border-radius:6px;
  padding:8px 10px;margin-bottom:8px;
}
.samples-t{font-size:.8rem;color:#5b7e93;font-weight:bold;margin-bottom:6px;}
.samples-h{font-size:.78rem;color:var(--sub);margin-top:6px;}
.sample{
  background:#fff;border:1px solid #a9c6d6;color:#2b6088;
  border-radius:14px;padding:6px 13px;margin:0 5px 5px 0;font-size:.88rem;
}
.sample:hover{background:#e8f2f7;}
.sample.on{background:#2b6088;border-color:#2b6088;color:#fff;font-weight:bold;}

/* 質問候補 */
.qbtn{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid #c9d1d4;
  border-radius:6px;padding:10px 13px;margin-bottom:7px;font-size:14px;
}
.qbtn:hover{background:#f0f7fc;border-color:var(--blue);}
.qbtn.asked{background:#f2f4f5;color:#9aa5a9;border-style:dashed;cursor:default;}
.qbudget{font-size:13px;color:var(--sub);margin-bottom:8px;}
.qbudget b{color:var(--orange-d);font-size:16px;}

/* 受付シートを開くボタン（狭い画面のみ） */
.sheetfab{display:none;}
@keyframes fabping{0%{transform:scale(1);}30%{transform:scale(1.13);}100%{transform:scale(1);}}

@media(max-width:760px){
  .split{display:block;}
  .split .sheetcol{display:none;}      /* 上下に並べず、ボタンで開く */
  .sheetfab{
    display:flex;align-items:center;gap:7px;
    position:fixed;right:14px;bottom:16px;z-index:120;
    background:var(--orange);color:#fff;font-weight:bold;
    border-radius:28px;padding:13px 20px;
    box-shadow:0 4px 12px rgba(0,0,0,.32);
  }
  .sheetfab.ping{animation:fabping .7s;}
}

/* 受付シートの重ね表示 */
.sheetov{position:fixed;inset:0;z-index:210;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;}
.sheetov-panel{
  width:100%;max-height:84vh;display:flex;flex-direction:column;
  background:#fffdf7;border-radius:12px 12px 0 0;overflow:hidden;
  animation:slideup .22s;
}
@keyframes slideup{from{transform:translateY(30px);opacity:.4;}to{transform:none;opacity:1;}}
.sheetov-head{
  background:var(--paper);color:#fff;padding:11px 14px;font-weight:bold;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;
}
.sheetov-body{overflow:auto;padding:12px;-webkit-overflow-scrolling:touch;}
.sheetov-body .sheet{border:none;box-shadow:none;padding:0;}

/* 聞き取ったことがシートに書かれた合図 */
.wrote{
  margin:0 0 9px;font-size:.86rem;color:#ffd9a0;
  border-left:3px solid rgba(255,217,160,.5);padding-left:9px;
}

/* 結果 */
.score{font-size:52px;font-weight:bold;color:var(--orange-d);line-height:1.1;}
.rev{border-left:4px solid var(--line);padding:10px 0 10px 13px;margin-bottom:12px;}
.rev.ok{border-color:var(--green);}
.rev.ng{border-color:var(--red);}
.rev .rt{font-weight:bold;font-size:14.5px;margin-bottom:3px;}
.rev .rd{font-size:13px;color:#555;}

/* 汎用 */
.fade{animation:fade .35s;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
hr.sep{border:none;border-top:1px solid var(--line2);margin:16px 0;}
.svgbox{width:100%;max-width:340px;margin:0 auto 10px;display:block;border-radius:8px;border:1px solid var(--line);}

@media(max-width:520px){
  .kin-body{padding:14px 11px;}
}

/* ============================================================
   文字サイズ
   ------------------------------------------------------------
   ここより上の font-size より、このブロックが優先されます。
   全体を大きく／小さくしたいときは、下の html{} の % を変えてください。
   画面右上の「文字」ボタンでも、標準／大／特大を切り替えられます。
   ============================================================ */
html{font-size:100%;}          /* 標準 = 16px */
html.big {font-size:112.5%;}   /* 大   = 18px */
html.xbig{font-size:125%;}     /* 特大 = 20px */

body{font-size:1.06rem;line-height:1.8;}

#topbar .clock{font-size:1.38rem;}
#topbar .phase{font-size:.92rem;}
#topbar .team{font-size:.88rem;}
#backbtn,#sizebtn{font-size:.88rem;}

.titlecard .tmain{font-size:clamp(1.3rem,5.2vw,1.8rem);}
.titlecard .tsub{font-size:.9rem;}

.navi .say{font-size:1rem;}
.panel h2{font-size:1.19rem;}
.muted{font-size:.92rem;}

button{font-size:1.06rem;}
.btn-lg{font-size:1.19rem;}
.btn-sm{font-size:.92rem;}

.kin-head .ic{font-size:.58rem;}
.kin-head .nm{font-size:1rem;}
.kin-head .plus{font-size:1.3rem;}
.fld > label{font-size:.88rem;}
.fld > label .req{font-size:.85rem;}
.fld input[type=text],.fld input[type=number],.fld textarea,.fld select{font-size:1.06rem;}
.fld .errmsg,.fld .hint{font-size:.88rem;}
.opt{font-size:1rem;}
.grp > .gh{font-size:.92rem;}
.actbtn{font-size:.94rem;}
.tbl{font-size:.92rem;}
.badge{font-size:.85rem;}

.pcard .ic{font-size:.65rem;}
.pcard .tx{font-size:.96rem;}
.pcard .chk{font-size:1.06rem;}

.phone .ring{font-size:.92rem;}
.phone .line{font-size:1.06rem;}
.phone .who{font-size:.88rem;}

.ncard .t{font-size:1rem;}
.ncard .m{font-size:.9rem;}
.vchip{font-size:.96rem;}

.modal h3{font-size:1.19rem;}
.doc{font-size:.92rem;}
.doc h4{font-size:1.1rem;}

.sheet{font-size:.92rem;}
.sheet .st{font-size:.96rem;}
.sheet .note{font-size:.85rem;}
.sheet .sec{font-size:.9rem;}

.screen .scr-title{font-size:1rem;}
.screen .scr-len{font-size:.88rem;}
.screen .scr-play{font-size:1.06rem;}

.qbtn{font-size:1rem;}
.qbudget{font-size:.92rem;}
.qbudget b{font-size:1.1rem;}
.sheetcol summary{font-size:1rem;}

.score{font-size:3.4rem;}
.rev .rt{font-size:1rem;}
.rev .rd{font-size:.94rem;}
</style>
</head>

  <div class="clock" id="clock">08:30</div>

  <button id="backbtn" onclick="goBack()" disabled>← もどる</button>

</div>
